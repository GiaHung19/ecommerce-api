# URL trỏ tới localhost port 3306, tự tạo databaseecommerce_db nếu chưa có
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

# Username và Password của tài khoản springstudent
spring.datasource.username=springstudent
spring.datasource.password=springstudent

# Cấu hình Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true